<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Maya Morris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
            position: relative;
        }

        /* ── FOTO ── */
        .photo-section {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .photo-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
            /* BLUR inicial — some após confirmação */
            filter: blur(18px);
            transform: scale(1.08); /* evita bordas brancas no blur */
            transition: filter 0.6s ease, transform 0.6s ease;
        }

        .photo-section img.revealed {
            filter: blur(0px);
            transform: scale(1);
        }

        /* Gradiente suave no fundo da foto */
        .photo-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(255,255,255,0.55) 60%,
                rgba(255,255,255,1) 100%
            );
            pointer-events: none;
            z-index: 1;
        }

        /* Nome sobreposto na foto */
        .name-overlay {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .name-overlay h1 {
            font-size: 26px;
            font-weight: 800;
            color: #111111;
            letter-spacing: -0.3px;
            text-shadow: 0 1px 3px rgba(255,255,255,0.6);
        }

        .verified-badge {
            width: 23px;
            height: 23px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        /* ── SECÇÃO INFERIOR ── */
        .bottom-section {
            flex-shrink: 0;
            padding: 10px 24px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .subtitle {
            font-size: 14px;
            color: #777777;
            font-weight: 400;
            text-align: center;
        }

        /* Botão Telegram — oculto até confirmar idade */
        .btn-telegram {
            display: flex;
            align-items: center;
            width: 100%;
            background: #111111;
            color: #ffffff;
            text-decoration: none;
            padding: 13px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.2s, opacity 0.5s, transform 0.5s;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
        }

        .btn-telegram.revealed {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .btn-telegram:active {
            background: #333;
            transform: scale(0.98);
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-icon svg { width: 28px; height: 28px; }

        .btn-text {
            flex: 1;
            text-align: center;
            padding-right: 32px;
        }

        .footer {
            font-size: 12px;
            color: #cccccc;
            letter-spacing: 0.3px;
        }

        .footer strong {
            color: #aaaaaa;
            font-weight: 600;
        }

        .age-gate {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.80);
            transition: opacity 0.4s ease;
        }

        .age-gate.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Card escuro estilo plataforma adulta */
        .age-content {
            background: #111111;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 36px 28px 28px;
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            animation: popIn 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
        }

        @keyframes popIn {
            from { transform: scale(0.88); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        .age-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50px;
            padding: 5px 14px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.8px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .age-title {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .age-sub {
            font-size: 13.5px;
            color: rgba(255,255,255,0.4);
            text-align: center;
            max-width: 240px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Divisor */
        .age-divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.07);
            margin-bottom: 24px;
        }

        /* Botão confirmar — laranja/âmbar como plataformas adultas */
        .btn-confirm {
            width: 100%;
            background: linear-gradient(135deg, #e8a020 0%, #d4780a 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            font-family: inherit;
            letter-spacing: 0.3px;
            margin-bottom: 12px;
        }

        .btn-confirm:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        /* Botão sair — discreto */
        .btn-leave {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.35);
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, color 0.2s;
            margin-bottom: 20px;
        }

        .btn-leave:hover {
            background: rgba(255,255,255,0.09);
            color: rgba(255,255,255,0.6);
        }

        .age-disclaimer {
            font-size: 11px;
            color: rgba(255,255,255,0.18);
            text-align: center;
            line-height: 1.5;
        }

        /* Responsivo telas pequenas */
        @media (max-height: 650px) {
            .name-overlay h1 { font-size: 22px; }
            .bottom-section  { gap: 9px; padding: 8px 20px 14px; }
            .btn-telegram    { padding: 11px 16px; font-size: 15px; }
            .subtitle        { font-size: 13px; }
            .age-content     { padding: 24px 20px 20px; }
            .age-title       { font-size: 20px; }
        }
    </style>
</head>
<body>

<!-- ════════ AGE VERIFICATION OVERLAY ════════ -->
<div class="age-gate" id="ageGate">
    <div class="age-content">
        <span class="age-badge">🔞 &nbsp; 18+ only</span>
        <h2 class="age-title">Adults Only</h2>
        <p class="age-sub">This page contains explicit adult content. You must be 18 years or older to continue.</p>
        <div class="age-divider"></div>
        <button class="btn-confirm" onclick="confirmAge()">I'm 18 years old — Enter</button>
        <button class="btn-leave" onclick="leavesite()">Exit</button>
        <p class="age-disclaimer">By entering you confirm you are at least 18 years old and consent to viewing adult content.</p>
    </div>
</div>

<!-- ════════ PÁGINA PRINCIPAL ════════ -->
<div class="container">

    <div class="photo-section">
        <img src="maya.jpg" alt="Maya Morris" id="mainPhoto">

        <div class="name-overlay">
            <h1>Maya Morris</h1>
            <!-- Verificado estilo Twitter/X -->
            <svg class="verified-badge" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="12" fill="#1D9BF0"/>
                <path d="M6.5 12.5 L10 16 L18 8"
                      stroke="white"
                      stroke-width="2.4"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      fill="none"/>
            </svg>
        </div>
    </div>

    <div class="bottom-section">
        <p class="subtitle">clique nisso, bobinho</p>

        <a href="https://t.me/maya493" class="btn-telegram" id="tgBtn">
            <div class="btn-icon">
                <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="tg" x1="24" y1="2" x2="24" y2="46" gradientUnits="userSpaceOnUse">
                            <stop offset="0" stop-color="#37AEE2"/>
                            <stop offset="1" stop-color="#1E96C8"/>
                        </linearGradient>
                    </defs>
                    <circle cx="24" cy="24" r="22" fill="url(#tg)"/>
                    <path d="M12.5 23.8l3.8 1.4 1.5 4.8c.2.6.9.8 1.4.4l2.2-1.8c.4-.4 1-.4 1.4 0l4 2.9c.5.4 1.2.1 1.3-.5l2.4-11.5c.2-.7-.5-1.3-1.1-1l-16.9 7c-.7.3-.6 1.1 0 1.3z" fill="white"/>
                </svg>
            </div>
            <span class="btn-text">basta clicar</span>
        </a>

        <span class="footer">mayamorris<strong>.bio</strong></span>
    </div>

</div>

<script>
    // Verifica se já confirmou nesta sessão
    if (sessionStorage.getItem('ageVerified') === 'yes') {
        revealContent(false); // sem animação, já confirmou
    }

    function confirmAge() {
        sessionStorage.setItem('ageVerified', 'yes');
        revealContent(true);
    }

    function leavesite() {
        // Redireciona para o Google
        window.location.href = 'https://www.google.com';
    }

    function revealContent(animate) {
        const gate    = document.getElementById('ageGate');
        const photo   = document.getElementById('mainPhoto');
        const tgBtn   = document.getElementById('tgBtn');

        // Esconde o overlay
        gate.classList.add('hidden');

        if (animate) {
            // Remove blur e mostra botão com animação
            setTimeout(() => {
                photo.classList.add('revealed');
                tgBtn.classList.add('revealed');
                gate.style.display = 'none';
            }, 100);
        } else {
            // Sem animação (já tinha confirmado antes)
            photo.style.filter    = 'blur(0)';
            photo.style.transform = 'scale(1)';
            tgBtn.classList.add('revealed');
            gate.style.display    = 'none';
        }
    }
</script>

</body>
</html>
